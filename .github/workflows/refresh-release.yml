# From it-env/templates/container-image/release-flows/ (see ../README.md there).
name: refresh release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Release even if non-Dependabot commits are unreleased
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Anything to release?
        id: guard
        env:
          FORCE: ${{ inputs.force }}
        run: |
          last=origin/main
          authors=$(git log --format='%an' "$last..HEAD")
          if [ -z "$authors" ]; then
            echo "Nothing since $last."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$FORCE" != true ] && echo "$authors" | grep -v -x -e 'dependabot\[bot\]' -e 'github-actions\[bot\]' | grep -q .; then
            echo "::notice::Unreleased non-Dependabot commits since $last; ship them with your next normal release."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Bump patch version
        id: bump
        if: steps.guard.outputs.go == 'true'
        run: |
          new=$(python3 - <<'PY'
          import re
          p = 'pubspec.yaml'; s = open(p).read()
          m = re.search(r'^version: (\d+)\.(\d+)\.(\d+)\+(\d+)$', s, re.M)
          v = f'{m[1]}.{m[2]}.{int(m[3]) + 1}'
          open(p, 'w').write(s[:m.start()] + f'version: {v}+{int(m[4]) + 1}' + s[m.end():])
          print(v)
          PY
          )
          # Same alignment the tag-release skill does by hand.
          python3 -m scripts.release.stack_version prepare-release --owner kounex --write
          python3 -m scripts.release.stack_version check-aligned
          echo "version=$new" >> "$GITHUB_OUTPUT"

      - name: Commit and publish
        if: steps.guard.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: prepare release v$VERSION (dependency refresh)"
          git push origin HEAD:"$GITHUB_REF_NAME"
          # Same order as .agents/skills/tag-release: dev pushed above, then main (ff only), then the tag.
          git push origin HEAD:main
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh workflow run release-images.yml --ref "v$VERSION"
          prev=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | sed -n 2p)
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes --notes-start-tag "$prev" --notes "## What changed since $prev

          - Automatic dependency refresh (base images and packages). No feature changes.

          ## Compare

          - [Full changelog](https://github.com/$GITHUB_REPOSITORY/compare/$prev...v$VERSION)"
